steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dddtech2/last-frontend:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dddtech2/last-frontend:latest'
      - '.'
    timeout: 1800s  # 30 minutes timeout

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dddtech2/last-frontend'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'last-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/dddtech2/last-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--max-instances'
      - '10'

# Use a machine with more resources for the build
options:
  machineType: 'E2_HIGHCPU_8'  # 8 vCPUs, 8GB RAM
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s  # 40 minutes total timeout
